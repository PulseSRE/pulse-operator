name: Release

on:
  push:
    tags:
      - 'v*'

env:
  OPERATOR_IMG: quay.io/amobrem/pulse-operator
  BUNDLE_IMG: quay.io/amobrem/pulse-operator-bundle
  CATALOG_IMG: quay.io/amobrem/pulse-operator-catalog

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - name: Build and push operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.OPERATOR_IMG }}:${{ github.ref_name }}
            ${{ env.OPERATOR_IMG }}:latest
      - name: Bump bundle CSV to this release's version
        # Dockerfile.bundle copies bundle/manifests verbatim - without this,
        # the CSV's name/version/containerImage/deployment-image stay
        # hardcoded at whatever they were last set to, so every release
        # after the first ships a bundle whose CSV doesn't match the tag
        # (and doesn't register as an OLM upgrade at all). This also sets
        # spec.replaces to the previous release, extending the upgrade graph.
        # RELEASE_TAG is passed via env (not interpolated into the run:
        # string) so a maliciously crafted tag name can't inject shell
        # commands here.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/bump-bundle-version.py "$RELEASE_TAG"
      - name: Build and push bundle image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.bundle
          push: true
          tags: |
            ${{ env.BUNDLE_IMG }}:${{ github.ref_name }}
            ${{ env.BUNDLE_IMG }}:latest

      # The catalog is what OLM actually reads. Until now it was a manual
      # podman+opm step (Dockerfile.catalog's header and README's "Build the
      # catalog image" both say so), which meant a tagged release published an
      # operator image and a bundle image that no cluster could ever be offered:
      # the CatalogSource kept serving the previous catalog. Every upgrade
      # needed someone to remember a procedure documented in a different file.
      #
      # CI already holds the Quay credentials these pushes need, so the only
      # thing that made this manual was opm not being present — and opm ships
      # as a container image.
      - name: Render the catalog from the pushed bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Render FROM the pushed image, never from the local bundle/ dir:
          # rendering a bare directory yields an olm.bundle with an empty
          # image field, and OLM can then never unpack it.
          mkdir -p catalog
          # opm renders through containers/image, which refuses to pull without
          # a signature policy and finds none inside the opm image — it searches
          # /.config, /etc and /usr/share/containers and the first release to
          # reach this step died on exactly that. Supply the permissive policy;
          # the only image being pulled is the bundle this same job just built
          # and pushed a step earlier.
          printf '{"default":[{"type":"insecureAcceptAnything"}]}' > /tmp/policy.json
          # And the registry credentials: `docker login` wrote them to the
          # runner's config, but the opm container has its own filesystem and
          # cannot see them. Without this a private bundle repo is a 401 here
          # even though every other step in this job can push to it.
          docker run --rm \
            -v /tmp/policy.json:/etc/containers/policy.json:ro \
            -v "${HOME}/.docker/config.json:/tmp/auth.json:ro" \
            -e REGISTRY_AUTH_FILE=/tmp/auth.json \
            quay.io/operator-framework/opm:latest \
            render "${BUNDLE_IMG}:${RELEASE_TAG}" -o yaml > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
          # The channel entry carries the upgrade edge. `replaces` comes from
          # the same git-tag lookup the CSV bump uses, so the two cannot
          # disagree about what this release upgrades from.
          REPLACES="$(python3 scripts/bump-bundle-version.py "$RELEASE_TAG" --print-replaces)"
          {
            echo "---"
            echo "defaultChannel: alpha"
            echo "name: pulse-operator"
            echo "schema: olm.package"
            echo "---"
            echo "entries:"
            echo "- name: pulse-operator.${RELEASE_TAG}"
            if [ -n "$REPLACES" ]; then
              echo "  replaces: pulse-operator.v${REPLACES}"
            fi
            echo "name: alpha"
            echo "package: pulse-operator"
            echo "schema: olm.channel"
            cat /tmp/rendered.yaml
          } > catalog/full-catalog.yaml
      - name: Build and push catalog image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.catalog
          push: true
          # linux/amd64 explicitly: cluster nodes are x86, and a runner-native
          # arm64 build would produce a catalog pod that will not start.
          platforms: linux/amd64
          tags: |
            ${{ env.CATALOG_IMG }}:${{ github.ref_name }}
            ${{ env.CATALOG_IMG }}:latest
