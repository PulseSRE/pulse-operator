name: Release

on:
  push:
    tags:
      - 'v*'

env:
  OPERATOR_IMG: quay.io/amobrem/pulse-operator
  BUNDLE_IMG: quay.io/amobrem/pulse-operator-bundle

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - name: Build and push operator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.OPERATOR_IMG }}:${{ github.ref_name }}
            ${{ env.OPERATOR_IMG }}:latest
      - name: Build and push bundle image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.bundle
          push: true
          tags: |
            ${{ env.BUNDLE_IMG }}:${{ github.ref_name }}
            ${{ env.BUNDLE_IMG }}:latest
