name: GitHub Release

# Creates the GitHub Release for a version tag, using that version's section of
# CHANGELOG.md as the notes. release.yml builds and publishes the images,
# bundle and catalog; it never created a Release, so tags v0.6.0 to v0.11.0
# shipped with none and the repository's "latest release" still said v0.5.0.
# Copied from pulse-agent's release.yml. Run it by hand (workflow_dispatch)
# with an older tag to backfill that tag's Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create a release for (e.g. v0.11.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Extract this version's changelog section
        id: notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Everything between "## <tag>" and the next "## v" heading.
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            # A tag with no changelog section still gets a release — a missing
            # release is what this workflow exists to prevent, and silence here
            # would recreate it.
            echo "::warning::No CHANGELOG.md section found for $TAG."
            echo "See CHANGELOG.md for details of this release." > notes.md
          fi
          echo "Release notes for $TAG:"
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
          echo "- Released \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
