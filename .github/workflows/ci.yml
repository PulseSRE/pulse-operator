name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt (must be a no-op)
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$out"
            echo "Run: gofmt -s -w ."
            exit 1
          fi
      - run: go vet ./...
      - name: golangci-lint
        # golangci-lint-action's "latest" resolves to a prebuilt binary that can
        # lag behind the newest Go releases (v1.64.8 refuses to run against a
        # go.mod targeting a newer Go than it was itself built with — hit this
        # exact failure with go.mod's go 1.26.0). go install always builds
        # against the runner's own (matching) Go toolchain instead.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          $(go env GOPATH)/bin/golangci-lint run ./...

  rbac-and-crd-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: pip install pyyaml
      - name: RBAC must not have drifted from config/rbac/role.yaml
        run: python3 scripts/sync-rbac.py --check
      - name: bundle CRD copy must match config/crd/bases
        run: diff config/crd/bases/pulse.ai_openshiftpulses.yaml bundle/manifests/pulse.ai_openshiftpulses.yaml
      - name: generated CRD/deepcopy must match api/v1alpha1 markers
        # Regenerates both from source and fails if that produces any diff —
        # otherwise a field added to types.go with no matching CRD/deepcopy
        # update stays green here while the API server silently prunes the
        # field on every write (structural schema drops unknown properties).
        run: |
          make generate manifests
          git diff --exit-code -- api/v1alpha1/zz_generated.deepcopy.go config/crd/bases/ || {
            echo "::error::api/v1alpha1/zz_generated.deepcopy.go or config/crd/bases/ is out of date. Run 'make generate manifests' (and 'make bundle' if config/crd/bases changed) and commit the result.";
            exit 1;
          }

  bundle-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install operator-sdk
        run: |
          OSDK_VERSION=v1.42.3
          curl -sSLo /usr/local/bin/operator-sdk \
            "https://github.com/operator-framework/operator-sdk/releases/download/${OSDK_VERSION}/operator-sdk_linux_amd64"
          chmod +x /usr/local/bin/operator-sdk
      - name: Validate the OLM bundle
        # Catches structural bugs the RBAC/CRD diff checks above can't see —
        # e.g. a probe nested at the wrong level in the CSV, which this repo
        # shipped for a while because nothing ever ran this validator in CI.
        run: make bundle-validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck (known-vulnerable dependencies)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec (static security analysis)
        uses: securego/gosec@master
        with:
          args: '-exclude-generated ./...'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.31 -p path)" >> $GITHUB_ENV
      - run: go vet ./...
      - run: go test -count=1 -coverprofile=cover.out ./...
      - name: Enforce a coverage floor on internal/controller
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 60) { print "coverage " p "% is below the 60% floor"; exit 1 } }'
      - name: Build binary
        run: go build -o /tmp/pulse-operator ./cmd/main.go
      - name: Smoke test — operator binary starts against envtest cluster
        run: |
          # Start the envtest control plane (kube-apiserver + etcd) and write a kubeconfig.
          # setup-envtest provides the binaries; we use `env` to launch them and capture
          # the API server address so we can build a kubeconfig.
          APISERVER="${KUBEBUILDER_ASSETS}/kube-apiserver"
          ETCD="${KUBEBUILDER_ASSETS}/etcd"

          # Start etcd
          ETCD_DIR=$(mktemp -d)
          $ETCD --data-dir="$ETCD_DIR" \
            --listen-client-urls=http://127.0.0.1:12379 \
            --advertise-client-urls=http://127.0.0.1:12379 \
            --listen-peer-urls=http://127.0.0.1:12380 > /tmp/etcd.log 2>&1 &
          ETCD_PID=$!

          # Start kube-apiserver
          CERT_DIR=$(mktemp -d)
          $APISERVER \
            --etcd-servers=http://127.0.0.1:12379 \
            --cert-dir="$CERT_DIR" \
            --secure-port=16443 \
            --authorization-mode=RBAC \
            --service-account-issuer=https://localhost \
            --service-account-signing-key-file="$CERT_DIR/apiserver.key" \
            --service-account-key-file="$CERT_DIR/apiserver.key" \
            > /tmp/apiserver.log 2>&1 &
          APISERVER_PID=$!

          # Wait for apiserver to be ready
          for i in $(seq 1 30); do
            curl -sk https://127.0.0.1:16443/healthz >/dev/null 2>&1 && break
            sleep 1
          done

          # Write a kubeconfig
          KUBECONFIG_FILE=$(mktemp --suffix=.yaml)
          kubectl config set-cluster envtest \
            --server=https://127.0.0.1:16443 \
            --insecure-skip-tls-verify=true \
            --kubeconfig="$KUBECONFIG_FILE"
          kubectl config set-credentials admin \
            --client-certificate="$CERT_DIR/apiserver.crt" \
            --client-key="$CERT_DIR/apiserver.key" \
            --kubeconfig="$KUBECONFIG_FILE"
          kubectl config set-context envtest \
            --cluster=envtest --user=admin \
            --kubeconfig="$KUBECONFIG_FILE"
          kubectl config use-context envtest --kubeconfig="$KUBECONFIG_FILE"

          # Run operator against envtest
          KUBECONFIG="$KUBECONFIG_FILE" /tmp/pulse-operator \
            --leader-elect=false \
            --metrics-bind-address=:0 \
            --health-probe-bind-address=:8089 > /tmp/operator.log 2>&1 &
          OP_PID=$!

          # Wait up to 20s for health probe
          OK=0
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8089/healthz >/dev/null 2>&1; then
              echo "✅ Operator healthy after ${i}s"
              OK=1
              break
            fi
            sleep 1
          done

          kill $OP_PID $APISERVER_PID $ETCD_PID 2>/dev/null
          rm -rf "$ETCD_DIR" "$CERT_DIR" "$KUBECONFIG_FILE"

          [ $OK -eq 1 ] || { echo "❌ Health probe did not respond"; cat /tmp/operator.log; exit 1; }

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build operator image (not pushed)
        run: docker build -t pulse-operator:ci -f Dockerfile .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pulse-operator:ci
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
