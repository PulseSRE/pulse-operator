name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.31 -p path)" >> $GITHUB_ENV
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Build binary
        run: go build -o /tmp/pulse-operator ./cmd/main.go
      - name: Smoke test — operator binary starts against envtest cluster
        run: |
          # Start the envtest control plane (kube-apiserver + etcd) and write a kubeconfig.
          # setup-envtest provides the binaries; we use `env` to launch them and capture
          # the API server address so we can build a kubeconfig.
          APISERVER="${KUBEBUILDER_ASSETS}/kube-apiserver"
          ETCD="${KUBEBUILDER_ASSETS}/etcd"

          # Start etcd
          ETCD_DIR=$(mktemp -d)
          $ETCD --data-dir="$ETCD_DIR" \
            --listen-client-urls=http://127.0.0.1:12379 \
            --advertise-client-urls=http://127.0.0.1:12379 \
            --listen-peer-urls=http://127.0.0.1:12380 > /tmp/etcd.log 2>&1 &
          ETCD_PID=$!

          # Start kube-apiserver
          CERT_DIR=$(mktemp -d)
          $APISERVER \
            --etcd-servers=http://127.0.0.1:12379 \
            --cert-dir="$CERT_DIR" \
            --secure-port=16443 \
            --authorization-mode=RBAC \
            --service-account-issuer=https://localhost \
            --service-account-signing-key-file="$CERT_DIR/apiserver.key" \
            --service-account-key-file="$CERT_DIR/apiserver.key" \
            > /tmp/apiserver.log 2>&1 &
          APISERVER_PID=$!

          # Wait for apiserver to be ready
          for i in $(seq 1 30); do
            curl -sk https://127.0.0.1:16443/healthz >/dev/null 2>&1 && break
            sleep 1
          done

          # Write a kubeconfig
          KUBECONFIG_FILE=$(mktemp --suffix=.yaml)
          kubectl config set-cluster envtest \
            --server=https://127.0.0.1:16443 \
            --insecure-skip-tls-verify=true \
            --kubeconfig="$KUBECONFIG_FILE"
          kubectl config set-credentials admin \
            --client-certificate="$CERT_DIR/apiserver.crt" \
            --client-key="$CERT_DIR/apiserver.key" \
            --kubeconfig="$KUBECONFIG_FILE"
          kubectl config set-context envtest \
            --cluster=envtest --user=admin \
            --kubeconfig="$KUBECONFIG_FILE"
          kubectl config use-context envtest --kubeconfig="$KUBECONFIG_FILE"

          # Run operator against envtest
          KUBECONFIG="$KUBECONFIG_FILE" /tmp/pulse-operator \
            --leader-elect=false \
            --metrics-bind-address=:0 \
            --health-probe-bind-address=:8089 > /tmp/operator.log 2>&1 &
          OP_PID=$!

          # Wait up to 20s for health probe
          OK=0
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8089/healthz >/dev/null 2>&1; then
              echo "✅ Operator healthy after ${i}s"
              OK=1
              break
            fi
            sleep 1
          done

          kill $OP_PID $APISERVER_PID $ETCD_PID 2>/dev/null
          rm -rf "$ETCD_DIR" "$CERT_DIR" "$KUBECONFIG_FILE"

          [ $OK -eq 1 ] || { echo "❌ Health probe did not respond"; cat /tmp/operator.log; exit 1; }
