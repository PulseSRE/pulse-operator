---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pulse-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pulse-operator-manager-role
subjects:
- kind: ServiceAccount
  name: pulse-operator-manager
  namespace: pulse-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-operator-manager
  namespace: pulse-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-operator-manager
  template:
    metadata:
      labels:
        app: pulse-operator-manager
    spec:
      serviceAccountName: pulse-operator-manager
      containers:
      - name: manager
        image: image-registry.openshift-image-registry.svc:5000/pulse-operator-system/pulse-operator@sha256:c867416ac87acd957fdcf28ceecaf1b94d65447bc1e63b0368057da95d161a07
        args:
        - --leader-elect=true
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
