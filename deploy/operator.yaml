---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pulse-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pulse-operator-manager-role
subjects:
- kind: ServiceAccount
  name: pulse-operator-manager
  namespace: pulse-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-operator-manager
  namespace: pulse-operator-system
spec:
  replicas: 1
  # One manager at a time; see the bundle CSV's strategy comment.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pulse-operator-manager
  template:
    metadata:
      labels:
        app: pulse-operator-manager
    spec:
      serviceAccountName: pulse-operator-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        # The release this commit is: must equal OperatorVersion in
        # internal/controller/compat.go (scripts/check-deploy-sync.py, run in
        # CI). Not :latest, which moves independently of the operand digests
        # below. To run a dev build: edit this line, or `oc set image` after
        # `make deploy`.
        image: quay.io/amobrem/pulse-operator:v0.14.1
        # Operand images, digest-pinned to match the CSV's RELATED_IMAGE_*
        # env and spec.relatedImages. Kept here too so a non-OLM install
        # (kubectl apply -f deploy/) deploys the same operands an OLM install
        # does, instead of silently falling back to the mutable-tag defaults
        # compiled into the binary.
        env:
        - name: RELATED_IMAGE_AGENT
          value: quay.io/amobrem/pulse-agent@sha256:a3c56766641784c70839716f07c6cc0be3e21c481f8bf9b7e91ceaa6033aca13
        - name: RELATED_IMAGE_UI
          value: quay.io/amobrem/openshiftpulse@sha256:f5259ccc2c2f22e0c6e15f27225bf7a8b9e96d947216d5d775129860ac12eb8f
        - name: RELATED_IMAGE_MCP_SERVER
          value: quay.io/amobrem/pulse-agent@sha256:1da4d677b499d2612deea7d054b80c38ad4c04700f7390e41c6059fabbea6d72
        - name: RELATED_IMAGE_RENDER
          value: quay.io/amobrem/openshiftpulse-render@sha256:282b945b78572363f876315f160776d4a6cc6df168b08876b31deca5097a8b97
        - name: RELATED_IMAGE_POSTGRESQL
          value: registry.redhat.io/rhel9/postgresql-15@sha256:cb2b214b470dfb39e19d6d71819844e855c52435c78deea025c1e0650ad175f8
        - name: RELATED_IMAGE_OAUTH_PROXY
          value: quay.io/openshift/origin-oauth-proxy@sha256:9b058fe1c117a05210dc5bd424d475a74b9a87d1c8b586fd7d7301b6f7bf2de7
        - name: RELATED_IMAGE_TEMPORAL
          value: docker.io/temporalio/auto-setup@sha256:9ce78f5a7ba7169acb659a8bb7a174a64251c3bfe1553d1fefdd669a59d41df5
        - name: RELATED_IMAGE_TEMPORAL_UI
          value: docker.io/temporalio/ui@sha256:7be8d6e41d4846ccb718c4f35956c9557512f8085e94a73954286a4e95113703
        # Helm runner for the UI's Helm Jobs, served in /config.js; same value
        # as the CSV. Empty until a release pins it (Helm actions disabled).
        - name: RELATED_IMAGE_HELM_RUNNER
          value: quay.io/amobrem/openshiftpulse-helm-runner@sha256:e4d843456105322b8dcfe4556728b5a06d3cf70d7f0613836025dc6974749984
        # No --leader-elect: this Deployment runs a single replica (see
        # spec.replicas above), so leader election has no failover target to
        # protect against — it provides zero HA benefit here. What it does
        # provide is a new failure mode: the manager treats losing its lease
        # (e.g. a single lease-renewal API call exceeding its deadline during
        # a transient apiserver latency spike) as fatal and exits, which
        # kubelet then has to restart from scratch. Observed 9 such crashes
        # in 17h on this cluster with no underlying reconcile bug — the
        # restarts were leader-election's own failure response, not evidence
        # of anything actually wrong. cmd/main.go's own --leader-elect flag
        # already defaults to false for exactly this reason; this arg was
        # overriding that default to true for no benefit.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
