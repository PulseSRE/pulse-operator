---
apiVersion: v1
kind: Namespace
metadata:
  name: pulse-operator-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulse-operator-manager
  namespace: pulse-operator-system
---
# Canonical ClusterRole — mirrors config/rbac/role.yaml.
# To update: edit config/rbac/role.yaml then run: scripts/sync-rbac.py --fix
# CI (scripts/sync-rbac.py --check) fails the build if this drifts from the source.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pulse-operator-manager-role
rules:
# BEGIN GENERATED RBAC (source: config/rbac/role.yaml — run scripts/sync-rbac.py --fix)
- apiGroups: [""]
  resources: ["configmaps","persistentvolumeclaims","secrets","serviceaccounts","services","events"]
  verbs: ["create","delete","get","list","patch","update","watch"]
- apiGroups: ["apps"]
  resources: ["deployments","statefulsets"]
  verbs: ["create","delete","get","list","patch","update","watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create","delete","get","list","patch","update","watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["create","delete","get","list","patch","update","watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles","clusterrolebindings","roles","rolebindings"]
  verbs: ["create","delete","get","list","patch","update","watch"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["servicemonitors","prometheusrules"]
  verbs: ["create","delete","get","list","patch","update","watch"]
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["create","delete","get","list","patch","update","watch"]
- apiGroups: ["oauth.openshift.io"]
  resources: ["oauthclients"]
  verbs: ["create","delete","get","list","patch","update","watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["create","get","list","patch","update","watch"]
- apiGroups: ["pulse.ai"]
  resources: ["openshiftpulses","openshiftpulses/status","openshiftpulses/finalizers"]
  verbs: ["create","delete","get","list","patch","update","watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list","watch","delete"]
- apiGroups: [""]
  resources: ["pods/log","nodes","namespaces","endpoints","limitranges","resourcequotas"]
  verbs: ["get","list","watch"]
- apiGroups: ["apps"]
  resources: ["replicasets","daemonsets"]
  verbs: ["get","list","watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get","list","watch"]
- apiGroups: ["batch"]
  resources: ["jobs","cronjobs"]
  verbs: ["get","list","watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get","list","watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes","pods"]
  verbs: ["get","list"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get","list","watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get","list","watch"]
- apiGroups: ["config.openshift.io"]
  resources: ["ingresses","clusterversions","clusteroperators"]
  verbs: ["get","list","watch"]
- apiGroups: ["image.openshift.io"]
  resources: ["imagestreams"]
  verbs: ["get","list","watch"]
# END GENERATED RBAC
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pulse-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pulse-operator-manager-role
subjects:
- kind: ServiceAccount
  name: pulse-operator-manager
  namespace: pulse-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-operator-manager
  namespace: pulse-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-operator-manager
  template:
    metadata:
      labels:
        app: pulse-operator-manager
    spec:
      serviceAccountName: pulse-operator-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: quay.io/amobrem/pulse-operator:latest
        args:
        - --leader-elect=true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
