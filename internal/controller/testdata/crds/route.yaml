# Minimal permissive CRD standing in for OpenShift's aggregated route.openshift.io/v1
# Route API so envtest (vanilla Kubernetes, no OpenShift apiserver) can serve it.
# Only used by tests — production clusters already provide this API natively.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routes.route.openshift.io
spec:
  group: route.openshift.io
  names:
    kind: Route
    listKind: RouteList
    plural: routes
    singular: route
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
    subresources:
      status: {}
