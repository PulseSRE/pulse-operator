# Minimal permissive CRD standing in for OpenShift's aggregated oauth.openshift.io/v1
# OAuthClient API so envtest (vanilla Kubernetes, no OpenShift apiserver) can serve it.
# Only used by tests — production clusters already provide this API natively.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: oauthclients.oauth.openshift.io
spec:
  group: oauth.openshift.io
  names:
    kind: OAuthClient
    listKind: OAuthClientList
    plural: oauthclients
    singular: oauthclient
  scope: Cluster
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
