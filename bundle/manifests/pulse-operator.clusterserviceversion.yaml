apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "pulse.ai/v1alpha1",
          "kind": "OpenShiftPulse",
          "metadata": {
            "name": "pulse",
            "namespace": "openshiftpulse"
          },
          "spec": {
            "vertexAI": {
              "projectId": "my-gcp-project",
              "region": "us-east5",
              "credentialSecret": "gcp-sa-key"
            },
            "agent": {
              "trustLevel": 2,
              "allowWriteOperations": false
            },
            "ui": {
              "replicas": 2
            },
            "database": {
              "storageSize": "5Gi"
            },
            "monitoring": {
              "enabled": true
            }
          },
          "status": {
            "phase": "Running",
            "agentVersion": "v2.9.0",
            "agentHealthy": true,
            "databaseReady": true,
            "uiAvailable": true,
            "routeHost": "pulse-openshiftpulse.apps.example.com",
            "conditions": [
              {
                "type": "AgentReady",
                "status": "True",
                "reason": "Ready",
                "message": "agent is healthy",
                "lastTransitionTime": "2026-01-01T00:00:00Z"
              }
            ]
          }
        }
      ]
    capabilities: Seamless Upgrades
    containerImage: quay.io/amobrem/pulse-operator:v0.1.0
    repository: https://github.com/PulseSRE/pulse-operator
    support: Red Hat CoE
  name: pulse-operator.v0.1.0
  namespace: openshiftpulse
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
      - description: OpenShiftPulse is the deployment configuration for the Pulse AI SRE agent and UI
        displayName: OpenShift Pulse
        kind: OpenShiftPulse
        name: openshiftpulses.pulse.ai
        specDescriptors:
          - description: >-
              Container image for the Pulse Agent. Falls back to a mutable
              :latest tag when unset — pin a digest for production.
            displayName: Agent Image
            path: agent.image
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
          - description: >-
              How much autonomy the agent has: 0=observe, 1=suggest,
              2=confirm (default), 3=batch, 4=autonomous.
            displayName: Agent Trust Level
            path: agent.trustLevel
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:number
        statusDescriptors:
          - description: Current lifecycle phase of the Pulse deployment.
            displayName: Phase
            path: phase
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.phase
          - description: >-
              Per-component reconciliation conditions (AgentReady,
              DatabaseReady, UIReady, Progressing).
            displayName: Conditions
            path: conditions
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.conditions
          - description: >-
              Agent container image last observed running while AgentReady
              was True.
            displayName: Agent Version
            path: agentVersion
            x-descriptors:
              - urn:alm:descriptor:text
          - description: Whether the agent's health probe is currently passing.
            displayName: Agent Healthy
            path: agentHealthy
            x-descriptors:
              - urn:alm:descriptor:text
          - description: Whether the PostgreSQL database is ready to serve the agent.
            displayName: Database Ready
            path: databaseReady
            x-descriptors:
              - urn:alm:descriptor:text
          - description: Whether the UI Deployment has at least one available replica.
            displayName: UI Available
            path: uiAvailable
            x-descriptors:
              - urn:alm:descriptor:text
          - description: Hostname of the Route serving the Pulse UI.
            displayName: Route Host
            path: routeHost
            x-descriptors:
              - urn:alm:descriptor:text
          - description: >-
              How long, in seconds, the most recently completed agent/UI
              image upgrade took to become healthy again. Set once an
              upgrade completes; absent/zero if none has happened yet.
            displayName: Last Upgrade Duration Seconds
            path: lastUpgradeDurationSeconds
            x-descriptors:
              - urn:alm:descriptor:text
        version: v1alpha1
  description: |
    ## OpenShift Pulse Operator

    Deploys and manages the **Pulse AI SRE Agent** — an AI-powered Kubernetes/OpenShift
    SRE assistant built on Claude. Pulse connects to your cluster via the Kubernetes API
    and uses Claude for diagnostics, incident triage, security audits, and automated
    remediation through natural language.

    ### Features
    - Full-stack deployment (AI agent + UI + PostgreSQL) from a single CR
    - OAuthClient redirect URI auto-configured after Route is ready
    - oauth-proxy image auto-detected from cluster ImageStream
    - Ingress domain auto-detected from cluster config
    - ACM multicluster support auto-detected

    ### Quick Start
    ```yaml
    apiVersion: pulse.ai/v1alpha1
    kind: OpenShiftPulse
    metadata:
      name: pulse
      namespace: openshiftpulse
    spec:
      vertexAI:
        projectId: my-gcp-project
        region: us-east5
        credentialSecret: gcp-sa-key
      agent:
        trustLevel: 2
    ```
  displayName: OpenShift Pulse
  install:
    spec:
      clusterPermissions:
        - rules:
          # BEGIN GENERATED RBAC (source: config/rbac/role.yaml — run scripts/sync-rbac.py --fix)
          - apiGroups: [""]
            resources: ["configmaps","persistentvolumeclaims","secrets","serviceaccounts","services","events"]
            verbs: ["create","delete","get","list","patch","update","watch"]
          - apiGroups: ["apps"]
            resources: ["deployments","statefulsets"]
            verbs: ["create","delete","get","list","patch","update","watch"]
          - apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["create","delete","get","list","patch","update","watch"]
          - apiGroups: ["policy"]
            resources: ["poddisruptionbudgets"]
            verbs: ["create","delete","get","list","patch","update","watch"]
          - apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["clusterroles","clusterrolebindings","roles","rolebindings"]
            verbs: ["create","delete","get","list","patch","update","watch"]
          - apiGroups: ["monitoring.coreos.com"]
            resources: ["servicemonitors","prometheusrules"]
            verbs: ["create","delete","get","list","patch","update","watch"]
          - apiGroups: ["route.openshift.io"]
            resources: ["routes"]
            verbs: ["create","delete","get","list","patch","update","watch"]
          - apiGroups: ["oauth.openshift.io"]
            resources: ["oauthclients"]
            verbs: ["create","delete","get","list","patch","update","watch"]
          - apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
            verbs: ["create","get","list","patch","update","watch"]
          - apiGroups: ["authentication.k8s.io"]
            resources: ["tokenreviews"]
            verbs: ["create"]
          - apiGroups: ["authorization.k8s.io"]
            resources: ["subjectaccessreviews"]
            verbs: ["create"]
          - apiGroups: ["monitoring.coreos.com"]
            resources: ["prometheuses/api"]
            verbs: ["get","create","update"]
          - apiGroups: ["pulse.ai"]
            resources: ["openshiftpulses","openshiftpulses/status","openshiftpulses/finalizers"]
            verbs: ["create","delete","get","list","patch","update","watch"]
          - apiGroups: [""]
            resources: ["pods"]
            verbs: ["get","list","watch","delete"]
          - apiGroups: [""]
            resources: ["pods/log","nodes","namespaces","endpoints","limitranges","resourcequotas"]
            verbs: ["get","list","watch"]
          - apiGroups: ["apps"]
            resources: ["replicasets","daemonsets"]
            verbs: ["get","list","watch"]
          - apiGroups: ["autoscaling"]
            resources: ["horizontalpodautoscalers"]
            verbs: ["get","list","watch"]
          - apiGroups: ["batch"]
            resources: ["jobs","cronjobs"]
            verbs: ["get","list","watch"]
          - apiGroups: ["discovery.k8s.io"]
            resources: ["endpointslices"]
            verbs: ["get","list","watch"]
          - apiGroups: ["metrics.k8s.io"]
            resources: ["nodes","pods"]
            verbs: ["get","list"]
          - apiGroups: ["storage.k8s.io"]
            resources: ["storageclasses"]
            verbs: ["get","list","watch"]
          - apiGroups: ["networking.k8s.io"]
            resources: ["ingresses"]
            verbs: ["get","list","watch"]
          - apiGroups: ["config.openshift.io"]
            resources: ["ingresses","clusterversions","clusteroperators"]
            verbs: ["get","list","watch"]
          - apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["get","list"]
          - apiGroups: ["apps"]
            resources: ["controllerrevisions"]
            verbs: ["get","list"]
          - apiGroups: ["argoproj.io"]
            resources: ["applications"]
            verbs: ["get","list"]
          - apiGroups: ["machineconfiguration.openshift.io"]
            resources: ["machineconfigpools"]
            verbs: ["get","list"]
          - apiGroups: ["image.openshift.io"]
            resources: ["imagestreams"]
            verbs: ["get","list","watch"]
          # END GENERATED RBAC
          serviceAccountName: pulse-operator-controller-manager
      deployments:
        - label:
            app.kubernetes.io/component: manager
            app.kubernetes.io/name: pulse-operator
            control-plane: controller-manager
          name: pulse-operator-controller-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                control-plane: controller-manager
            # Recreate: one manager at a time. With the default rolling update an
            # OLM upgrade ran the old and new manager together, each setting the
            # agent image from its own RELATED_IMAGE_AGENT, and the agent
            # (Recreate itself) restarted on every flip. Leader election is
            # deliberately off (see ci.yml), so the strategy is what serializes.
            strategy:
              type: Recreate
            template:
              metadata:
                labels:
                  control-plane: controller-manager
              spec:
                containers:
                  - command:
                      - /manager
                    image: quay.io/amobrem/pulse-operator:v0.1.0
                    name: manager
                    # Operand images, pinned by digest and mirrored into
                    # spec.relatedImages below. The operator reads these and
                    # falls back to its compiled defaults only when unset, so
                    # a bundle install always deploys the exact images this
                    # release was tested against. scripts/bump-bundle-version.py
                    # re-resolves them at release time; keep the two lists in
                    # sync (internal/controller/images_test.go enforces it).
                    env:
                      - name: RELATED_IMAGE_AGENT
                        value: quay.io/amobrem/pulse-agent@sha256:009ee80aef5049a2377175faa4a725608c79a7b80a795b45632d4f847b32954f
                      - name: RELATED_IMAGE_UI
                        value: quay.io/amobrem/openshiftpulse@sha256:81d7ecf91119e19983281ee7591e3eece86fe53094341e8eceafacaee98c6d17
                      - name: RELATED_IMAGE_MCP_SERVER
                        value: quay.io/amobrem/pulse-agent@sha256:a0a4b9ef4efdc5810250d4ec8641f25c3247a2fa0f2c9852fe1759aca586b165
                      - name: RELATED_IMAGE_RENDER
                        value: quay.io/amobrem/openshiftpulse-render@sha256:cec17637e6165c3b354f68438ad6e7ef17cac205ac3001856036a023bad37673
                      - name: RELATED_IMAGE_POSTGRESQL
                        value: registry.redhat.io/rhel9/postgresql-15@sha256:cb2b214b470dfb39e19d6d71819844e855c52435c78deea025c1e0650ad175f8
                      - name: RELATED_IMAGE_OAUTH_PROXY
                        value: quay.io/openshift/origin-oauth-proxy@sha256:9b058fe1c117a05210dc5bd424d475a74b9a87d1c8b586fd7d7301b6f7bf2de7
                      - name: RELATED_IMAGE_TEMPORAL
                        value: docker.io/temporalio/auto-setup@sha256:9ce78f5a7ba7169acb659a8bb7a174a64251c3bfe1553d1fefdd669a59d41df5
                      - name: RELATED_IMAGE_TEMPORAL_UI
                        value: docker.io/temporalio/ui@sha256:7be8d6e41d4846ccb718c4f35956c9557512f8085e94a73954286a4e95113703
                    ports:
                      - containerPort: 8082
                        name: metrics
                        protocol: TCP
                    resources:
                      limits:
                        cpu: 500m
                        memory: 256Mi
                      requests:
                        cpu: 10m
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    # livenessProbe/readinessProbe MUST live here, inside the
                    # container entry — not as siblings of `containers` at the
                    # pod-spec level. OLM's Deployment materialization only
                    # copies fields PodSpec actually has; a probe placed at
                    # this container's sibling level is silently dropped, so
                    # the OLM-installed operator ran with no health probes at
                    # all while deploy/operator.yaml (manifest install, same
                    # probes nested correctly) always had them.
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                serviceAccountName: pulse-operator-controller-manager
                terminationGracePeriodSeconds: 10
    strategy: deployment
  # The tile icon in OperatorHub / the operator catalog: the Pulse logo from
  # pulse-ui (docs/logo.svg), kept in docs/assets/pulse-icon.svg.
  icon:
    - base64data: 
      mediatype: image/svg+xml
  installModes:
    - supported: false
      type: OwnNamespace
    - supported: false
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: true
      type: AllNamespaces
  keywords:
    - openshift
    - ai
    - sre
    - pulse
    - kubernetes
    - claude
    - observability
  links:
    - name: Operator Source
      url: https://github.com/PulseSRE/pulse-operator
    - name: Documentation
      url: https://pulsesre.github.io/pulse-operator/
    - name: Pulse Agent (AI SRE Backend)
      url: https://github.com/PulseSRE/pulse-agent
    - name: Pulse UI (Frontend)
      url: https://github.com/PulseSRE/pulse-ui
    - name: Pulse Agent Docs
      url: https://pulsesre.github.io/pulse-agent/
    - name: Pulse UI Docs
      url: https://pulsesre.github.io/pulse-ui/
  maintainers:
    - email: amobrem@redhat.com
      name: Ali Mobrem
  maturity: alpha
  # Matches the README's "OpenShift 4.12+" badge (OCP 4.12 ships Kubernetes
  # 1.25) — was previously 1.28.0, which silently blocked installs on any
  # 4.12-4.14 cluster the README claimed to support.
  minKubeVersion: 1.25.0
  provider:
    name: Red Hat CoE
    url: https://github.com/PulseSRE
  # Every operand this operator can deploy, digest-pinned, and matching the
  # RELATED_IMAGE_* env vars on the manager container above — the operator
  # reads those, so this list and what actually gets pulled cannot drift.
  #
  # Previously these were mutable tags that nothing consumed: the manager had
  # no corresponding env, so the operator used its compiled defaults and this
  # list was documentation only. It had already fallen out of date (render and
  # both Temporal images were missing). Tags also meant a mirrored cluster had
  # to re-mirror whenever one moved, and `pulse-agent:mcp-server` moving under
  # a running deployment is what took the MCP server down.
  relatedImages:
    - name: pulse-agent
      image: quay.io/amobrem/pulse-agent@sha256:009ee80aef5049a2377175faa4a725608c79a7b80a795b45632d4f847b32954f
    - name: pulse-ui
      image: quay.io/amobrem/openshiftpulse@sha256:81d7ecf91119e19983281ee7591e3eece86fe53094341e8eceafacaee98c6d17
    - name: pulse-mcp-server
      image: quay.io/amobrem/pulse-agent@sha256:a0a4b9ef4efdc5810250d4ec8641f25c3247a2fa0f2c9852fe1759aca586b165
    - name: pulse-render
      image: quay.io/amobrem/openshiftpulse-render@sha256:cec17637e6165c3b354f68438ad6e7ef17cac205ac3001856036a023bad37673
    - name: postgresql
      image: registry.redhat.io/rhel9/postgresql-15@sha256:cb2b214b470dfb39e19d6d71819844e855c52435c78deea025c1e0650ad175f8
    - name: oauth-proxy
      image: quay.io/openshift/origin-oauth-proxy@sha256:9b058fe1c117a05210dc5bd424d475a74b9a87d1c8b586fd7d7301b6f7bf2de7
    - name: temporal
      image: docker.io/temporalio/auto-setup@sha256:9ce78f5a7ba7169acb659a8bb7a174a64251c3bfe1553d1fefdd669a59d41df5
    - name: temporal-ui
      image: docker.io/temporalio/ui@sha256:7be8d6e41d4846ccb718c4f35956c9557512f8085e94a73954286a4e95113703
  version: 0.1.0
